```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Library</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./styles.css">

    <!-- Favicon -->
<link rel="icon" href="./logo.svg" type="image/svg+xml">
    <!-- JavaScript -->
    <script src="./script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>My Library</h1>
            <p class="subtitle">A little space for every story.</p>
        </div>

        <button id="new-book-btn" class="primary-btn" type="button">
            + New Book
        </button>
    </header>

    <main class="main-content">
        <section class="library-section">
            <div class="section-heading">
                <div>
                    <h2>Your Collection</h2>
                    <p class="section-description">
                        All your favorite books in one place.
                    </p>
                </div>
            </div>

            <div id="book-container" class="book-grid">
                <!-- JavaScript will render book cards here. -->
            </div>
        </section>
    </main>

    <dialog id="book-dialog" class="book-dialog">
        <div class="dialog-header">
            <div>
                <h2>Add a New Book</h2>
                <p>Fill in the details below.</p>
            </div>

            <button
                id="close-dialog-btn"
                class="close-btn"
                type="button"
                aria-label="Close form"
            >
                &times;
            </button>
        </div>

        <form id="book-form">
            <div class="form-group">
                <label for="title">Book Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. The Hobbit"
                    required
                >
            </div>

            <div class="form-group">
                <label for="author">Author</label>
                <input
                    type="text"
                    id="author"
                    name="author"
                    placeholder="e.g. J.R.R. Tolkien"
                    required
                >
            </div>

            <div class="form-group">
                <label for="pages">Number of Pages</label>
                <input
                    type="number"
                    id="pages"
                    name="pages"
                    min="1"
                    step="1"
                    placeholder="e.g. 310"
                    required
                >
            </div>

            <label class="checkbox-group" for="read">
                <input
                    type="checkbox"
                    id="read"
                    name="read"
                >
                <span>I have already read this book</span>
            </label>

            <div class="form-actions">
                <button
                    id="cancel-btn"
                    class="secondary-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button class="primary-btn" type="submit">
                    Add Book
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
```
